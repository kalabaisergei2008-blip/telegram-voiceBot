<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка Notion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h3 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: var(--tg-theme-button-color, #248bcf); outline: none; }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #248bcf);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <h3>⚙️ Настройка интеграции</h3>
    
    <div class="form-group">
        <label for="token">Notion Internal Integration Token:</label>
        <input type="text" id="token" placeholder="secret_...">
    </div>

    <div class="form-group">
        <label for="db_id">Database ID:</label>
        <input type="text" id="db_id" placeholder="Вставьте ID вашей таблицы...">
    </div>

    <button id="save_btn">Сохранить настройки</button>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на максимум

        document.getElementById('save_btn').addEventListener('click', () => {
            let token_val = document.getElementById('token').value.trim();
            let db_id_val = document.getElementById('db_id').value.trim();
            
            if (!token_val || !db_id_val) {
                alert("Пожалуйста, заполните все поля!");
                return;
            }

            // Упаковываем данные в JSON-строку
            let data = {
                notion_token: token_val,
                notion_db_id: db_id_val
            };

            // Отправляем данные обратно боту
            tg.sendData(JSON.stringify(data));
            
            // Закрываем мини-приложение
            tg.close();
        });
    </script>
</body>
</html>
